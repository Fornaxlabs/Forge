# FORGE v4 CI pipeline (GitHub Actions form; translate to GitLab if needed).
# All jobs MUST be green before merge. Enable branch protection on main:
# PR required, no force-push.
#
# Each job is guarded by `if: hashFiles('pyproject.toml') != ''` so a freshly
# bootstrapped repo (no code yet) gets NEUTRAL CI, not failing CI + email spam.
# The jobs activate automatically once the project has a pyproject.toml.
name: forge-ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict .

  test:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Coverage threshold 80%; fail below.
      - run: uv run pytest --cov --cov-fail-under=80

  security:
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run pip-audit
      - uses: gitleaks/gitleaks-action@v2

  sbom:
    # NIST SSDF PS/PW: generate CycloneDX SBOM and keep as artifact.
    if: ${{ hashFiles('pyproject.toml') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run cyclonedx-py environment -o sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
