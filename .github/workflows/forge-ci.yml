# FORGE dogfoods its own gate: the harness runs the same quality + proof checks it
# stamps into governed projects. All jobs must be green before merge.
name: forge-ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Pinned deliberately: an unpinned linter means CI can break with NO code
      # change (ruff 0.16 added rules that reddened a green tree). Forge's own
      # ENGINEERING.md says pin dependencies — this is that rule applied to itself.
      - run: pip install ruff==0.15.17 mypy==2.1.0 pytest coverage
      - name: lint
        run: ruff check .
      - name: types
        run: mypy selfaudit hooks traces memory status evals
      - name: tests + coverage (fail under 80%)
        run: |
          python3 -m coverage run -m pytest -q
          python3 -m coverage report --include="hooks/*,memory/*,traces/*,selfaudit/*" --fail-under=80
      - name: guard proof (24/24 block, 0% false positive)
        run: python3 evals/prove_guard.py
      - name: self-audit (Forge governs itself)
        run: python3 selfaudit/forge_doctor.py
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history — a shallow clone is not a real secret scan
      # The official gitleaks ACTION requires a paid licence for organisation-owned
      # repos; the gitleaks CLI is MIT and free. Same scanner, no licence, and pinned
      # so a new release can't redden a green tree (see the ruff lesson in `gate`).
      - name: install gitleaks (pinned)
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: scan committed history for secrets
        run: gitleaks git --no-banner --redact --exit-code 1

  certify:
    # Continuous self-certification: regenerate "Forge Verified" from real signals on
    # every push, tied to this commit, and keep the manifest as an artifact. The level
    # is honest — it reflects what actually passes here (needs the gate+security jobs).
    needs: [gate, security]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the secrets scan is real, not shallow
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: forge certify (machine-verified claims only)
        # Informational: generate the manifest regardless of level. The gate + security
        # jobs are the real enforcement; the level here will honestly be low in CI (the
        # local pre-push git hook isn't in a fresh checkout), and that's fine — we keep
        # the honest manifest as an artifact, we don't gate merges on it.
        run: |
          python3 status/forge_certify.py . --json > FORGE-CERT.json || true
          python3 -c "import json;d=json.load(open('FORGE-CERT.json'));print('Forge Verified level:',d['level'])"
      - uses: actions/upload-artifact@v4
        with:
          name: forge-cert
          path: FORGE-CERT.json
