# FORGE's own pre-commit gate — the harness runs the tools it prescribes.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks: [{id: gitleaks}]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks: [{id: ruff}]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0
    hooks: [{id: mypy, files: '^(selfaudit|hooks|traces|memory|status|evals)/'}]
